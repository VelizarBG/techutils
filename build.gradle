plugins {
	id 'net.fabricmc.fabric-loom'
	id 'me.modmuss50.mod-publish-plugin'
	id 'maven-publish'
}

loom {
	accessWidenerPath = file("src/main/resources/techutils.accesswidener")
}

version = project.mod_version + '+' + project.minecraft_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	 exclusiveContent {
		forRepository {
			maven {
				name = "JitPack"
				url = "https://jitpack.io"
			}
		}
		filter {
			includeGroup "com.github.Chocohead"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Curseforge"
				url = "https://www.cursemaven.com"
			}
		}
		filter {
			includeGroup "curse.maven"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	exclusiveContent {
		forRepository {
			maven { // conditional-mixin-fabric required by Litematica
				name = "FallenBreath Maven"
				url = "https://maven.fallenbreath.me/releases"
			}
		}
		filter {
			includeGroup "me.fallenbreath"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "TerraformersMC"
				url = "https://maven.terraformersmc.com/releases/"
			}
		}
		filter {
			includeGroup "com.terraformersmc"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "WorldEdit Maven"
				url = "https://maven.enginehub.org/repo/"
			}
		}
		filter {
			includeGroupAndSubgroups "com.sk89q"
			includeGroupAndSubgroups "org.enginehub"
		}
	}
	/*exclusiveContent {
		forRepository {
			maven {
				name = "sonatype-oss-snapshots1"
				url = "https://s01.oss.sonatype.org/content/repositories/snapshots/"
			}
		}
		filter {
			includeGroup "org.vineflower"
		}
	}*/
	exclusiveContent {
		forRepository {
			maven {
				name = "Masa-Sakura Maven"
				url = "https://masa.dy.fi/maven/sakura-ryoko"
			}
		}
		filter {
			includeGroupAndSubgroups "fi.dy.masa"
		}
	}
}

afterEvaluate {
	loom.runs.configureEach {
		vmArgs(
				"-Xmx4G",
				// JRE with DCEVM required https://github.com/JetBrains/JetBrainsRuntime/releases
				"-XX:+AllowEnhancedClassRedefinition",
				// Useful for hotswaps https://stackoverflow.com/a/46495011
				"-XX:ReservedCodeCacheSize=1G",
				// https://gist.github.com/maityyy/3dbcd558d58a6412c3a2a38c72706e8e
				"-javaagent:${ configurations.compileClasspath.find { it.name.contains("sponge-mixin") } }"
		)

		// https://github.com/SpongePowered/Mixin/wiki/Mixin-Java-System-Properties
		property "mixin.debug.export=true" // export classes with all mixin changes to run/.mixin.out

		//programArgs "--username=VelizarBG", "--uuid=2990d3e0-928c-49a8-a1f0-3c6931f931fb"
	}
}

dependencies {
//	vineflowerDecompilerClasspath "org.vineflower:vineflower:1.12.0-SNAPSHOT"

	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation include("com.github.Chocohead:Fabric-ASM:v${project.fabric_asm_version}")

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	api("com.terraformersmc:modmenu:${project.modmenu_version}")
	implementation("fi.dy.masa.malilib:malilib-fabric-${project.malilib_version}")
	implementation("fi.dy.masa.litematica:litematica-fabric-${project.litematica_version}")
	implementation("fi.dy.masa.tweakeroo:tweakeroo-fabric-${project.tweakeroo_version}")

	compileOnly "com.sk89q.worldedit:worldedit-fabric-mc${project.worldedit_version}"
	compileOnly "org.enginehub.worldeditcui-protocol:worldeditcui-protocol-common-mc${project.worldeditcui_protocol_version}"
	compileOnly "org.enginehub.worldeditcui-protocol:worldeditcui-protocol-fabric-mc${project.worldeditcui_protocol_version}"
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.mod_version
	inputs.property "id", project.mod_id
	inputs.property "name", project.mod_name
	inputs.property "minecraft_dependency", project.minecraft_dependency
	inputs.property "loader_dependency", project.loader_dependency
	inputs.property "malilib_dependency", project.malilib_dependency
	inputs.property "litematica_dependency", project.litematica_dependency
	inputs.property "breaks_worldedit_dependency", project.breaks_worldedit_dependency
	inputs.property "fabric_api_version", project.fabric_api_version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		def valueMap = [
				"id"							: project.mod_id,
				"name"							: project.mod_name,
				"version"						: project.mod_version,
				"minecraft_dependency"			: project.minecraft_dependency,
				"loader_dependency"				: project.loader_dependency,
				"malilib_dependency"			: project.malilib_dependency,
				"litematica_dependency"			: project.litematica_dependency,
				"breaks_worldedit_dependency"	: project.breaks_worldedit_dependency,
				"fabric_api_version"			: project.fabric_api_version,
		]
		expand valueMap
	}
}

// Minecraft 26.1 upwards uses Java 25.
def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release.set(targetJavaVersion)
}

java {
	def javaVersion = JavaVersion.toVersion(targetJavaVersion)
	if (JavaVersion.current() < javaVersion) {
		toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
	}

	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

publishMods {
	file = jar.archiveFile
	additionalFiles.from(sourcesJar.archiveFile)
	version = "$project.version"
	displayName = "Technical Utilities $project.mod_version+$project.title_version"
	type = STABLE
	modLoaders = ["fabric"]

	System.getenv("changelog")?.with { String changelogg ->
		changelog = changelogg
	}

	System.getenv("modrinth_key")?.with { String key ->
		modrinth {
			accessToken = key
			projectId = project.modrinth_id
			minecraftVersions = [*project.release_versions.split(" ")]
			requires {
				slug = "litematica"
				version = project.litematica_dependency_modrinth
			}
			requires {
				slug = "malilib"
				version = project.malilib_dependency_modrinth
			}
			optional {
				slug = "worldedit"
				version = project.worldedit_dependency_modrinth
			}
		}
	}

	// When dry run is enabled the release assets will be saved to the build directory for testing.
//	dryRun = true
}
